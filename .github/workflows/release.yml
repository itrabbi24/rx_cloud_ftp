name: Release

# Push a tag like v1.2.0 to build the executables and attach them to a GitHub Release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/RxCloude.exe
            dist/RxCloudeServer.exe
          generate_release_notes: true
